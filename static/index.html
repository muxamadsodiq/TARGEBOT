<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>Premium Quiz</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="app">
    <!-- ───────── CHAT VIEW ───────── -->
    <section id="view-chat" class="view active">
      <header class="chat-header glass">
        <button class="back-btn" aria-label="back">‹</button>
        <img id="profilePhoto" class="avatar" alt="" src="/static/default-avatar.svg" />
        <div class="who">
          <div id="profileName" class="name">Premium Quiz</div>
          <div id="profileSub" class="sub">online</div>
        </div>
        <div class="header-icons">
          <span class="dot"></span>
        </div>
      </header>

      <div id="chatBody" class="chat-body"></div>

      <div id="optionsBar" class="options-bar"></div>
    </section>

    <!-- ───────── WHEEL VIEW ───────── -->
    <section id="view-wheel" class="view">
      <div class="wheel-wrap glass">
        <h2 class="wheel-title">Omad g'ildiragi 🎁</h2>
        <p class="wheel-sub">Tugmani bosing va o'z foizingizni yutib oling!</p>
        <div class="wheel-stage">
          <div class="wheel-pointer"></div>
          <canvas id="wheel" width="380" height="380"></canvas>
          <div class="wheel-center">SPIN</div>
        </div>
        <button id="spinBtn" class="btn-primary">🎯 G'ildirakni aylantirish</button>
        <div id="prizeBox" class="prize-box hidden">
          <div class="prize-label">Sizning yutug'ingiz</div>
          <div id="prizeValue" class="prize-value">—</div>
          <button id="usePrizeBtn" class="btn-primary">🎁 Yutuqdan foydalanish</button>
        </div>
      </div>
    </section>

    <!-- ───────── FORM VIEW ───────── -->
    <section id="view-form" class="view">
      <div class="form-wrap glass">
        <div class="form-icon">📝</div>
        <h2>Ma'lumotlaringiz</h2>
        <p class="muted">Yutug'ingizdan foydalanish uchun to'ldiring</p>
        <form id="leadForm" class="form" autocomplete="on">
          <label>
            <span>Ism</span>
            <input name="name" required placeholder="Ismingiz" />
          </label>
          <label>
            <span>Familiya</span>
            <input name="surname" required placeholder="Familiyangiz" />
          </label>
          <label>
            <span>Telefon raqam</span>
            <input name="phone" type="tel" required placeholder="+998 90 123 45 67" value="+998 " inputmode="tel" />
          </label>
          <small class="muted" style="font-size:11px;opacity:.6">Format: +998 XX XXX XX XX</small>
          <button type="submit" class="btn-primary">Yuborish ✓</button>
        </form>
      </div>
    </section>

    <!-- ───────── DONE VIEW ───────── -->
    <section id="view-done" class="view">
      <div class="done-wrap glass">
        <div class="check">✓</div>
        <h2>Rahmat!</h2>
        <p class="muted">Tez orada siz bilan bog'lanamiz.</p>
        <div class="done-prize">
          Sizning yutug'ingiz: <b id="donePct">—</b>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
